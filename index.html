<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ficha</title>
<!-- Página pública: no poner acá nada personal. Todo el contenido real va cifrado en bundle.enc. -->
<style>
:root{--ground:#F4F7F6;--surface:#FFFFFF;--ink:#1B2430;--muted:#5C6A70;--line:#D9E1DF;--accent:#0E6F6B;--accent-ink:#FFFFFF;--crit:#B3382E;--shadow:0 1px 2px rgba(20,40,40,.06),0 8px 24px -12px rgba(20,40,40,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#10171A;--surface:#18232A;--ink:#E6EDEA;--muted:#98A7A9;--line:#2B3A40;--accent:#5FC9C2;--accent-ink:#06211F;--crit:#F08C82;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--ground:#10171A;--surface:#18232A;--ink:#E6EDEA;--muted:#98A7A9;--line:#2B3A40;--accent:#5FC9C2;--accent-ink:#06211F;--crit:#F08C82;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px}
p{margin:0;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
input[type=password]{font:inherit;color:inherit;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rem{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
.rem input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--crit);font-size:14px;font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Contenido privado</h1>
  <p id="msg">Ingresá la contraseña para verlo.</p>
  <label>Contraseña<input type="password" name="pw" autocomplete="current-password" autofocus required></label>
  <label class="rem"><input type="checkbox" name="rem" checked> Recordar en este dispositivo</label>
  <div class="err" id="err" hidden>Contraseña incorrecta. Probá de nuevo.</div>
  <button type="submit" id="btn">Abrir</button>
</form>
<script>
(async () => {
  const KEY = 'ficha-pw';
  const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
  async function open(buf, password){
    const u8 = new Uint8Array(buf), salt = u8.slice(0,16), iv = u8.slice(16,28), ct = u8.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
  }
  // reemplaza esta página por la página descifrada (sus scripts corren normalmente)
  function show(html){ document.open(); document.write(html); document.close(); }
  let buf;
  try { const r = await fetch('bundle.enc?v=20261030172309', {cache:'no-store'}); if (!r.ok) throw new Error(r.status); buf = await r.arrayBuffer(); }
  catch (e) { document.getElementById('msg').textContent = 'No se pudo descargar el contenido (' + (e.message || 'error') + '). Revisá la conexión y recargá.'; f.hidden = false; f.querySelectorAll('label,button').forEach(el => el.hidden = true); return; }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) { try { return show(await open(buf, saved)); } catch { try { localStorage.removeItem(KEY); } catch {} } }
  f.hidden = false; f.pw.focus();
  f.addEventListener('submit', async e => {
    e.preventDefault(); btn.disabled = true; btn.textContent = 'Abriendo…'; err.hidden = true;
    let html;
    try { html = await open(buf, f.pw.value); }
    catch { err.hidden = false; btn.disabled = false; btn.textContent = 'Abrir'; f.pw.select(); return; }
    if (f.rem.checked) { try { localStorage.setItem(KEY, f.pw.value); } catch {} }
    show(html);
  });
})();
</script>
</body>
</html>
